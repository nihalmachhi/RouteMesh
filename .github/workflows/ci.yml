name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --cov=routemesh --cov-fail-under=85
      - run: uv run python -m routemesh.sim.report
      - run: uv run python site/scripts/export_fixtures.py
      - run: git diff --exit-code -- benchmarks/results/policy-comparison.json site/src/data/results.generated.json site/src/features/simulator/__fixtures__/
      - run: docker compose config -q && docker compose build
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run lint && npm run typecheck && npm test -- --run && npm run build
        working-directory: site
