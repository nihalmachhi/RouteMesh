[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routemesh"
version = "0.1.0"
description = "An observable health-aware application-level reverse proxy."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "prometheus-client>=0.21,<1",
  "python-multipart>=0.0.12,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "pre-commit>=3.8,<5", "locust>=2.32,<3", "matplotlib>=3.9,<4", "coverage[toml]>=7.6,<8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["integration: exercises a running proxy and test backends", "load: smoke load validation"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]
